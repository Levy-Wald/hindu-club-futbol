name: buzon-inbox

# Punta B de DOCTRINA-AUTONOMIA (canon vive en servicios-clevel-os): el BUZÓN por EVENTO.
# Un issue con label `inbox`/`inbox:urgent` despierta al robot al instante → costo idle ~cero.
# El robot trabaja DENTRO del sobre de permisos (abajo, por `settings:` porque en headless el action
# NO lee .claude/settings.json) y deja PR verde SIN mergear código. Nodo `saas` (SaaS Empresarial), hijo de scl.
#
# ⚠️ INERTE hasta que exista el secreto ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
# API key de console.anthropic.com. Se setea SIN `--body -` (ese flag guarda el literal "-", no lee stdin):
#   printf %s "$K" | gh secret set ANTHROPIC_API_KEY --repo Levy-Wald/hindu-club-futbol

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  issues:
    types: [labeled]

jobs:
  buzon:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'inbox' || github.event.label.name == 'inbox:urgent'
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 30"
          # Sobre de permisos del buzón (headless no lee .claude/settings.json → va por acá).
          # allow = lo que el buzón puede solo; deny = el "nunca" (mergear/cerrar/destructivo).
          settings: |
            {
              "permissions": {
                "defaultMode": "acceptEdits",
                "allow": [
                  "Read", "Grep", "Glob", "Edit", "Write",
                  "Bash(git status *)", "Bash(git diff *)", "Bash(git log *)", "Bash(git branch *)",
                  "Bash(git fetch *)", "Bash(git checkout *)", "Bash(git switch *)",
                  "Bash(git add *)", "Bash(git commit *)",
                  "Bash(git push origin *)", "Bash(git push -u origin *)",
                  "Bash(gh pr create *)", "Bash(gh pr view *)", "Bash(gh pr diff *)",
                  "Bash(gh issue view *)", "Bash(gh issue comment *)",
                  "Bash(gh run list *)", "Bash(gh run view *)",
                  "Bash(pnpm *)", "Bash(node *)", "Bash(npx *)", "Bash(python3 *)", "Bash(bash -n *)"
                ],
                "deny": [
                  "Bash(gh pr merge *)", "Bash(git merge *)",
                  "Bash(git push * --force*)", "Bash(git push -f *)",
                  "Bash(git reset --hard *)", "Bash(rm -rf *)",
                  "Bash(gh issue close *)", "Bash(gh repo delete *)", "Bash(gh issue delete *)"
                ]
              }
            }
          prompt: |
            Sos el BUZÓN autónomo del repo Levy-Wald/hindu-club-futbol (nodo `saas` · SaaS Empresarial, hijo de scl).
            Te disparó un issue con label inbox/inbox:urgent.

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            Body:
            ${{ github.event.issue.body }}

            Reglas (leé tu CLAUDE.md, .claude/, y el canon de autonomía + metodología del ecosistema en
            https://github.com/Levy-Wald/servicios-clevel-os/blob/main/docs/canon/metodologia-ecosistema.md):
            1. Entendé qué pide el issue y hacé el trabajo DENTRO del sobre de permisos (el de este workflow).
            2. Trabajá en una rama `buzon/<slug-corto>`, commiteá con pathspec explícito, abrí un PR y dejá que el CI valide.
            3. Para cualquier cambio que toque código/config: NO mergees a main y NO cierres el issue. Comentá el link
               al PR y dejalo ABIERTO para revisión humana — mergear código es acción gateada (ask), no tuya.
            4. Si el pedido no está claro, cae fuera del sobre, o necesita mergear código/borrar/mover plata/mandar
               mensajes afuera: NO lo hagas. Comentá "bloqueado, necesito OK de Yair: <por qué>" y terminá.
            5. Ruteo (metodología §3): sos hijo de scl. Podés leer/avisar hacia arriba, no ejecutar hacia arriba.
            6. Respondé y documentá en español.
